---
- name: Normalize tags
  set_fact:
    env_tag: "{{ input_tag_Environment | default('unknown') | lower }}"
    inst_tag: "{{ nr_institution | default('unknown') }}"

- name: Select license key
  set_fact:
    newrelic_license_key: >-
      {{
        lookup('env', 'NEW_RELIC_LICENSE_KEY_PROD')
        if env_effective == 'prd'
        else
        lookup('env', 'NEW_RELIC_LICENSE_KEY_NPROD')
      }}

- name: Ensure unzip is installed
  package:
    name: unzip
    state: present

- name: Ensure New Relic directory exists
  file:
    path: /opt/newrelic
    state: directory
    mode: '0755'

- name: Download New Relic Java agent
  get_url:
    url: https://download.newrelic.com/newrelic/java-agent/newrelic-agent/current/newrelic-java.zip
    dest: /opt/newrelic-java.zip
    mode: '0644'

- name: Unarchive New Relic agent
  unarchive:
    src: /opt/newrelic-java.zip
    dest: /opt
    remote_src: yes
    creates: /opt/newrelic/newrelic.jar

- name: Configure newrelic.yml
  template:
    src: newrelic.yml.j2
    dest: /opt/newrelic/newrelic.yml
    mode: '0644'

- name: Check if newrelic.jar exists
  stat:
    path: /opt/newrelic/newrelic.jar
  register: nr_agent

