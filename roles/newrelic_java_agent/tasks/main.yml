---
- name: Normalize tags
  set_fact:
    env_tag: "{{ input_tag_Environment | default('Unknown') | lower }}"
    inst_tag: "{{ input_tag_institution | default('Unknown') }}"

- name: Select license key
  set_fact:
    newrelic_license_key: >-
      {{
        lookup('env', 'NEW_RELIC_LICENSE_KEY_PROD')
        if env_tag == 'prd'
        else
        lookup('env', 'NEW_RELIC_LICENSE_KEY_NPROD')
      }}

- name: Ensure unzip is installed
  package:
    name: unzip
    state: present

- name: Ensure /opt/newrelic directory exists
  file:
    path: /opt
    state: directory
    mode: '0644'

- name: Download New Relic Java agent
  get_url:
    url: https://download.newrelic.com/newrelic/java-agent/newrelic-api/8.20.0/newrelic-java-8.20.0.zip
    dest: /opt/newrelic-java.zip
    mode: '0644'

- name: UnZip New Relic agent
  unarchive:
    src: /opt/newrelic-java.zip
    dest: /opt
    remote_src: yes
  
- name: Replace New Relic license key placeholder
  become: yes
  replace:
    path: /opt/newrelic/newrelic.yml
    regexp: "<%= license_key %>"
    replace: "{{ newrelic_license_key }}"
  
 
