---
- name: Normalize tags
  set_fact:
    env_tag: "{{ input_tag_Environment | default('unknown') | lower }}"
    inst_tag: "{{ input_tag_institution | default('unknown') }}"
    app_name: "{{ app_name | default('unknown') }}"

- name: Select license key
  set_fact:
    newrelic_license_key: >-
      {{
        lookup('env', 'NEW_RELIC_LICENSE_KEY_PROD')
        if env_tag == 'prd'
        else
        lookup('env', 'NEW_RELIC_LICENSE_KEY_NPROD')
      }}

- name: Set NewRelic version
  set_fact:
    nr_version: "8.23.0"

- name: Current agent version
  shell: unzip -p /opt/newrelic/newrelic.jar META-INF/MANIFEST.MF | grep Implementation-Version
  register: current_version
  failed_when: false
  changed_when: false

- name: Determine upgrade requirement
  set_fact:
    upgrade_required: "{{ nr_version not in current_version.stdout | default('') }}"

- name: Download New Relic agent
  get_url:
    url: "https://download.newrelic.com/newrelic/java-agent/newrelic-agent/{{ nr_version }}/newrelic-java-{{ nr_version }}.zip"
    dest: "/opt/newrelic-java.zip"
    mode: '0644'
  when: upgrade_required

- name: Remove old New Relic agent
  file:
    path: /opt/newrelic
    state: absent
  when: upgrade_required

- name: Extract New Relic agent
  unarchive:
    src: "/opt/newrelic-java.zip"
    dest: /opt
    remote_src: yes
  when: upgrade_required
  register: extract_result

- name: Update license key
  lineinfile:
    path: /opt/newrelic/newrelic.yml
    regexp: '^\s*license_key:'
    line: "  license_key: {{ newrelic_license_key }}"
  when: upgrade_required
  notify: restart tomcat

- name: Update AppName
  lineinfile:
    path: /opt/newrelic/newrelic.yml
    regexp: '^\s*app_name:'
    line: "  app_name: {{ app_name }}"
    firstmatch: yes
  when: upgrade_required
  notify: restart tomcat  
