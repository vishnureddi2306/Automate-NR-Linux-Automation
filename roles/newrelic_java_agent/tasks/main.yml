---
- name: Normalize tags
  set_fact:
    env_tag: "{{ input_tag_Environment | default('') | lower }}"
    inst_tag: "{{ nr_institution | default('') }}"

- name: Select license key
  set_fact:
    newrelic_license_key: >-
      {{
        lookup('env', 'NEW_RELIC_LICENSE_KEY_PROD')
        if env_tag == 'prd'
        else
        lookup('env', 'NEW_RELIC_LICENSE_KEY_NPROD')
      }}

- name: Ensure unzip is installed
  package:
    name: unzip
    state: present

- name: Ensure New Relic directory exists
  file:
    path: /opt/newrelic
    state: directory
    mode: '0644'  #rw-r-r

- name: Download New Relic Java agent
  get_url:
    url: https://download.newrelic.com/newrelic/java-agent/newrelic-agent/current/newrelic-java.zip
    dest: /opt/newrelic-java.zip
    mode: '0644'

- name: Unarchive New Relic agent
  unarchive:
    src: /opt/newrelic-java.zip
    dest: /opt
    remote_src: yes    # To Specify The source file already exists on the remote Linux server, not on the control node. Else need to provide files/jar
    creates: /opt/newrelic/newrelic.jar  # For idempotency, If this file already exists, skips extraction if the playbook ran again.

- name: Configure newrelic.yml
  template:
    src: newrelic.yml.j2
    dest: /opt/newrelic/newrelic.yml
    mode: '0644' 
  notify: 
    - restart sigma services
    - restart tomcat service
    
- name: Deploy setenv.sh for Tomcat
  template:
    src: setenv.sh.j2
    dest: /sigma/tomcat/bin/setenv.sh
    owner: sigqa
    mode: '0755'
  notify: 
    - restart sigma services
    - restart tomcat service

