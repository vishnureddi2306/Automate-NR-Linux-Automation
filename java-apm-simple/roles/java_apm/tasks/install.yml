---
- name: Create New Relic directory
  ansible.builtin.file:
    path: "{{ agent_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Back up old JAR
  ansible.builtin.copy:
    src: "{{ agent_dir }}/newrelic.jar"
    dest: "{{ agent_dir }}/newrelic.jar.before-{{ latest_version }}.bak"
    remote_src: true
    mode: '0644'
  when: agent_file.stat.exists

- name: Install new JAR
  ansible.builtin.copy:
    src: "{{ temp_dir.path }}/newrelic/newrelic.jar"
    dest: "{{ agent_dir }}/newrelic.jar"
    remote_src: true
    owner: root
    group: root
    mode: '0644'
