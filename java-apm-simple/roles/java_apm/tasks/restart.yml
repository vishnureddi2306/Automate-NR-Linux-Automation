---
- name: Stop application services
  ansible.builtin.command:
    cmd: "./{{ restart.stop }}"
    chdir: "{{ restart.directory }}"
  become: true
  become_user: "{{ restart.user }}"

- name: Wait five seconds
  ansible.builtin.pause:
    seconds: 5

- name: Start application services
  ansible.builtin.command:
    cmd: "./{{ restart.start }}"
    chdir: "{{ restart.directory }}"
  become: true
  become_user: "{{ restart.user }}"

- name: Check application status
  ansible.builtin.command:
    cmd: "./{{ restart.status }}"
    chdir: "{{ restart.directory }}"
  become: true
  become_user: "{{ restart.user }}"
  register: app_status
  changed_when: false
  until: app_status.rc == 0
  retries: 12
  delay: 10

- name: Show status
  ansible.builtin.debug:
    var: app_status.stdout_lines
