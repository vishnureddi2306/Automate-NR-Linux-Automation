---
- name: Load this server's settings
  ansible.builtin.set_fact:
    server: "{{ java_apm.servers[inventory_hostname] }}"
    agent_dir: "{{ java_apm.agent_dir }}"

- name: Select restart scripts
  ansible.builtin.set_fact:
    restart: "{{ server.restart | default(java_apm.standard_restart) }}"

- name: Check prerequisites
  ansible.builtin.import_tasks: check.yml

- name: Check agent version
  ansible.builtin.import_tasks: version.yml

- name: Install or upgrade if necessary
  ansible.builtin.include_tasks: install.yml
  when: update_agent | bool

- name: Check every setenv file
  ansible.builtin.import_tasks: setenv.yml

- name: Restart if agent or startup settings changed
  ansible.builtin.include_tasks: restart.yml
  when: (update_agent | bool) or (setenv_result.changed | bool) or (config_result.changed | default(false) | bool)

- name: Remove temporary download
  ansible.builtin.file:
    path: "{{ temp_dir.path }}"
    state: absent
  when: temp_dir is defined

- name: Finish
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: installed={{ installed_version | default('missing', true) }}, available={{ latest_version }}"
