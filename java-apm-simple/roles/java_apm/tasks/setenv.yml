---
- name: Check agent config file
  ansible.builtin.stat:
    path: "{{ agent_dir }}/newrelic.yml"
  register: agent_yaml

- name: Create agent config only if missing
  ansible.builtin.template:
    src: newrelic.yml.j2
    dest: "{{ agent_dir }}/newrelic.yml"
    owner: root
    group: "{{ restart.user }}"
    mode: '0640'
  when: not agent_yaml.stat.exists
  register: config_created
  no_log: true

- name: Read existing agent config
  ansible.builtin.slurp:
    src: "{{ agent_dir }}/newrelic.yml"
  register: agent_yaml_text
  no_log: true

- name: Check config layout before editing
  ansible.builtin.assert:
    that:
      - "(agent_yaml_text.content | b64decode) is search('(?m)^common:')"
      - "(agent_yaml_text.content | b64decode) is search('(?m)^  license_key:')"
    fail_msg: "Review existing newrelic.yml: expected common/license_key layout"
  no_log: true

- name: Update license key
  ansible.builtin.lineinfile:
    path: "{{ agent_dir }}/newrelic.yml"
    regexp: '^  license_key:'
    line: "  license_key: {{ nr_license_key | to_json }}"
  register: license_update
  no_log: true

- name: Set agent config permissions
  ansible.builtin.file:
    path: "{{ agent_dir }}/newrelic.yml"
    owner: root
    group: "{{ restart.user }}"
    mode: '0640'
  register: config_permissions

- name: Record agent config changes
  ansible.builtin.set_fact:
    config_result:
      changed: "{{ (config_created.changed | default(false)) or license_update.changed or config_permissions.changed }}"

- name: Read existing startup files
  ansible.builtin.slurp:
    src: "{{ item.setenv }}"
  loop: "{{ server.services }}"
  register: startup_files
  failed_when: false
  no_log: true

- name: Check for unmanaged Java agents
  ansible.builtin.assert:
    that:
      - "(item.failed | default(false)) or ('-javaagent:' not in (item.content | b64decode)) or ('# BEGIN NEW RELIC APM' in (item.content | b64decode))"
    fail_msg: "Unmanaged -javaagent found in {{ item.item.setenv }}. Review it before proceeding."
  loop: "{{ startup_files.results }}"
  loop_control:
    label: "{{ item.item.setenv }}"

- name: Add or update New Relic startup settings
  ansible.builtin.blockinfile:
    path: "{{ service.setenv }}"
    create: true
    backup: true
    mode: '0644'
    marker: '# {mark} NEW RELIC APM'
    block: "{{ lookup('template', 'newrelic_setenv.j2') }}"
  loop: "{{ server.services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  register: setenv_result
