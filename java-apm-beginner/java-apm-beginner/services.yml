---
java_apm:

  agent_path: /opt/newrelic
  download_url: https://download.newrelic.com/newrelic/java-agent/newrelic-agent/current/newrelic-java.zip
  
  standard_scripts:
    user: app
    path: /opt/banner/scripts
    stop: stop_apps.sh
    start: start_app.sh
    status: status_apps.sh
    
  servers:
  
    banner-ap01:
      environment: NPROD
      institution: CU
      service_tag: Banner CU
      application: SSB9
      team: Banner
      
      services:
        - name: CU SSB9 Admin
          setenv: /opt/ssb9/admin/bin/setenv.sh
        - name: CU SSB9 Student
          setenv: /opt/ssb9/student/bin/setenv.sh
        - name: CU SSB9 Registration
          setenv: /opt/ssb9/registration/bin/setenv.sh
          
    banner-ap02:
      environment: NPROD
      institution: CU
      service_tag: Banner CU
      application: SSB9
      team: Banner
      
      services:
        - name: CU SSB9 Admin
          setenv: /opt/ssb9/admin/bin/setenv.sh
        - name: CU SSB9 Student
          setenv: /opt/ssb9/student/bin/setenv.sh
          
    banner-walden-ap01:
      environment: PROD
      institution: WU
      service_tag: Banner Walden
      application: BAM
      team: Banner
      
      scripts:
        user: tomcat
        path: /sigma/bam/scripts
        stop: stop-bam.sh
        start: start-bam.sh
        status: status-bam.sh
        
      services:
        - name: WU BAM Service 1
          setenv: /sigma/bam/service1/bin/setenv.sh
        - name: WU BAM Service 2
          setenv: /sigma/bam/service2/bin/setenv.sh
