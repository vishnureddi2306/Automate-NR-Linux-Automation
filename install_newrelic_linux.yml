---
- name: Install or Upgrade New Relic Infrastructure Agent on Linux
  hosts: linux
  become: yes
  gather_facts: yes

  vars:
    nr_config_file: /etc/newrelic-infra.yml

  tasks:

    - name: Fail if New Relic license key is not provided
      fail:
        msg: "New Relic license key is missing. Provide it via AWX Credential."
      when: newrelic_license_key is not defined

    - name: Add New Relic GPG key
      rpm_key:
        key: https://download.newrelic.com/infrastructure_agent/gpg/newrelic-infra.gpg
        state: present
      when: ansible_os_family == "RedHat"

    - name: Add New Relic YUM repository
      yum_repository:
        name: newrelic-infra
        description: New Relic Infrastructure Agent
        baseurl: https://download.newrelic.com/infrastructure_agent/linux/yum/el/$releasever/$basearch
        gpgcheck: yes
        gpgkey: https://download.newrelic.com/infrastructure_agent/gpg/newrelic-infra.gpg
        enabled: yes
      when: ansible_os_family == "RedHat"

    - name: Add New Relic APT repository
      apt:
        deb: https://download.newrelic.com/infrastructure_agent/linux/apt/pool/main/n/newrelic-infra/newrelic-infra_latest_amd64.deb
      when: ansible_os_family == "Debian"

    - name: Install or upgrade New Relic Infrastructure Agent
      package:
        name: newrelic-infra
        state: latest

    - name: Configure New Relic license key
      copy:
        dest: "{{ nr_config_file }}"
        content: |
          license_key: {{ newrelic_license_key }}
          log_level: info
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start New Relic Infrastructure service
      service:
        name: newrelic-infra
        enabled: yes
        state: started
