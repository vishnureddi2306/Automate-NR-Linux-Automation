---
- name: Stop all services on server
  ansible.builtin.command:
    argv: ["{{ restart_config.scripts_path }}/{{ restart_config.stop_script }}"]
    chdir: "{{ restart_config.scripts_path }}"
  become: true
  become_user: "{{ restart_config.user }}"
  register: stopped_services

- name: Wait five seconds after stop
  ansible.builtin.pause:
    seconds: 5

- name: Start all services on server
  ansible.builtin.command:
    argv: ["{{ restart_config.scripts_path }}/{{ restart_config.start_script }}"]
    chdir: "{{ restart_config.scripts_path }}"
  become: true
  become_user: "{{ restart_config.user }}"
  register: started_services

- name: Wait for status script to report success
  ansible.builtin.command:
    argv: ["{{ restart_config.scripts_path }}/{{ restart_config.status_script }}"]
    chdir: "{{ restart_config.scripts_path }}"
  become: true
  become_user: "{{ restart_config.user }}"
  register: service_status
  changed_when: false
  failed_when: false
  until: service_status.rc == 0
  retries: 12
  delay: 10

- name: Assert application status successful
  ansible.builtin.assert:
    that:
      - service_status.rc == 0
    fail_msg: "Status script did not confirm services healthy. Check application logs and output: {{ service_status.stdout }} {{ service_status.stderr }}"
