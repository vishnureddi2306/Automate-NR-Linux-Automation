---
- name: Check installed agent JAR
  ansible.builtin.stat:
    path: "{{ agent_config.jar_path }}"
  register: installed_jar

- name: Get installed agent version
  ansible.builtin.command:
    argv: [java, -jar, "{{ agent_config.jar_path }}", -v]
  register: installed_version_command
  changed_when: false
  when: installed_jar.stat.exists

- name: Create temporary download directory
  ansible.builtin.tempfile:
    state: directory
    prefix: nr-java-
  register: nr_staging

- name: Download current official New Relic Java agent
  ansible.builtin.get_url:
    url: "{{ agent_config.download_url }}"
    dest: "{{ nr_staging.path }}/newrelic-java.zip"
    mode: '0600'
    timeout: 90

- name: Extract staged release
  ansible.builtin.unarchive:
    src: "{{ nr_staging.path }}/newrelic-java.zip"
    dest: "{{ nr_staging.path }}"
    remote_src: true

- name: Verify staged agent JAR exists
  ansible.builtin.stat:
    path: "{{ nr_staging.path }}/newrelic/newrelic.jar"
  register: staged_jar

- name: Fail if download structure is unexpected
  ansible.builtin.assert:
    that:
      - staged_jar.stat.isreg | default(false)

- name: Get staged latest agent version
  ansible.builtin.command:
    argv: [java, -jar, "{{ nr_staging.path }}/newrelic/newrelic.jar", -v]
  register: latest_version_command
  changed_when: false

- name: Parse installed and latest versions
  ansible.builtin.set_fact:
    installed_version: >-
      {{ ((installed_version_command.stdout | default('')) ~ ' ' ~ (installed_version_command.stderr | default(''))) | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('', true) }}
    latest_version: >-
      {{ (latest_version_command.stdout ~ ' ' ~ latest_version_command.stderr) | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('', true) }}

- name: Validate parsed version values
  ansible.builtin.assert:
    that:
      - latest_version | length > 0
      - not installed_jar.stat.exists or installed_version | length > 0
    fail_msg: "Unable to parse Java agent version; do not replace JAR blindly"

- name: Decide whether to install or upgrade
  ansible.builtin.set_fact:
    agent_change_required: "{{ (not installed_jar.stat.exists) or (installed_version is version(latest_version, '<')) }}"

- name: Prevent accidental downgrade
  ansible.builtin.assert:
    that:
      - not installed_jar.stat.exists or installed_version is version(latest_version, '<=')
    fail_msg: "Installed agent is newer than downloaded current release; refusing downgrade"
