---
- name: Check agent YAML exists
  ansible.builtin.stat:
    path: "{{ agent_config.install_path }}/newrelic.yml"
  register: nr_yaml

- name: Create minimal agent configuration when absent
  ansible.builtin.template:
    src: newrelic.yml.j2
    dest: "{{ agent_config.install_path }}/newrelic.yml"
    owner: root
    group: "{{ restart_config.user }}"
    mode: '0640'
  when: not nr_yaml.stat.exists
  no_log: true
  register: license_created

- name: Read existing agent YAML for configuration validation
  ansible.builtin.slurp:
    src: "{{ agent_config.install_path }}/newrelic.yml"
  register: nr_yaml_content
  no_log: true

- name: Ensure agent config has a common section
  ansible.builtin.assert:
    that:
      - "(nr_yaml_content.content | b64decode) is search('(?m)^common:')"
    fail_msg: "Existing newrelic.yml is not in expected format; review manually"
  no_log: true

- name: Set license in common section without replacing other agent settings
  ansible.builtin.lineinfile:
    path: "{{ agent_config.install_path }}/newrelic.yml"
    regexp: '^  license_key:'
    insertafter: '^common:'
    line: "  license_key: '{{ nr_license_key }}'"
    backup: false
  no_log: true
  register: license_updated

- name: Set license file permissions
  ansible.builtin.file:
    path: "{{ agent_config.install_path }}/newrelic.yml"
    owner: root
    group: "{{ restart_config.user }}"
    mode: '0640'

- name: Record agent configuration changes
  ansible.builtin.set_fact:
    license_changes:
      changed: "{{ (license_created.changed | default(false)) or (license_updated.changed | default(false)) }}"

- name: Inspect existing setenv files
  ansible.builtin.slurp:
    src: "{{ item.setenv_path }}"
  loop: "{{ server_config.services }}"
  loop_control:
    label: "{{ item.setenv_path }}"
  register: existing_setenv
  failed_when: false
  no_log: true

- name: Reject pre-existing unmanaged agent configuration
  ansible.builtin.assert:
    that:
      - "(item.failed | default(false)) or ('-javaagent:' not in (item.content | b64decode)) or ('# BEGIN ANSIBLE MANAGED NEW RELIC APM' in (item.content | b64decode))"
    fail_msg: "Existing unmanaged -javaagent detected; migrate it before automation to avoid duplicate agents"
  loop: "{{ existing_setenv.results }}"
  loop_control:
    label: "{{ item.item.setenv_path }}"

- name: Add or update only the managed New Relic block
  ansible.builtin.blockinfile:
    path: "{{ service.setenv_path }}"
    create: true
    backup: true
    mode: '0644'
    marker: '# {mark} ANSIBLE MANAGED NEW RELIC APM'
    block: "{{ lookup('template', 'newrelic_setenv_block.j2') }}"
  loop: "{{ server_config.services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  register: setenv_changes
